name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, mlOps_project]
  schedule:
    - cron: "0 9 * * 1"  # toda segunda às 9h — para o job de monitoring

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff>=0.4
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
          pip install feast==0.42.0 --no-deps
      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile -t melanoma-api:ci .

  monitoring:
    name: Drift report (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install evidently>=0.4 pandas pyarrow
      - run: python monitoring/run_monitoring.py
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: monitoring/reports/
